<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Wallet</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="auth" class="auth">
  <div class="auth-box">
    <h2>My Wallet</h2>

    <input id="username" placeholder="Email">
    <input id="pin" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="register()">Sign Up</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>My Wallet</h2>
    <div onclick="showPage('overview')">Overview</div>
    <div onclick="showPage('wallet')">Wallet</div>
    <div onclick="showPage('withdraw')">Withdraw</div>
    <div onclick="showPage('bank')">Link Bank</div>
  </div>

  <!-- CONTENT -->
  <div class="main">

    <!-- OVERVIEW -->
    <div id="overview" class="page">
      <h1>Welcome back</h1>

      <div class="card">
        <p>Account Balance</p>
        <h1 id="total">€0</h1>

        <button onclick="showPage('withdraw')">Withdraw</button>
        <button onclick="showPage('bank')">Link Bank</button>
      </div>
    </div>

    <!-- WALLET -->
    <div id="wallet" class="page hidden"></div>

    <!-- WITHDRAW -->
    <div id="withdraw" class="page hidden">
      <div class="card">
        <h2>Withdraw</h2>

        <input id="amountW" placeholder="Amount">
        <textarea placeholder="Bank details"></textarea>

        <button onclick="withdraw()">Submit</button>
      </div>
    </div>

    <!-- BANK -->
    <div id="bank" class="page hidden">
      <div class="card">
        <h2>Select Bank</h2>

        <div class="grid">
          <div onclick="selectBank('BBVA')"><img src="bbva.png"></div>
          <div onclick="selectBank('Santander')"><img src="santander.png"></div>
          <div onclick="selectBank('ING')"><img src="ing.png"></div>
        </div>

        <div id="bankLogin" class="hidden">
          <h3 id="bankName"></h3>
          <input id="bankUser" placeholder="User">
          <input id="bankPass" placeholder="Password">
          <button onclick="connectBank()">Connect</button>
        </div>

      </div>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
