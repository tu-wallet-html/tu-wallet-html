<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TuWallet Dashboard</title>
<style>
body {margin:0;font-family:Arial;background:#0b0f1a;color:white;}
.container{padding:20px;max-width:1100px;margin:auto;}
.card{background:#111827;border-radius:15px;padding:20px;margin-bottom:20px;border:1px solid #1f2937;}
.btn{padding:12px 20px;border-radius:10px;border:none;cursor:pointer;font-weight:bold;}
.primary{background:#3b82f6;color:white;}
.secondary{background:#1f2937;color:white;}
input, textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #374151;background:#0b0f1a;color:white;margin-top:10px;}
.flex{display:flex;gap:10px;flex-wrap:wrap;}
.bank-option{flex:1;padding:15px;border:1px solid #374151;border-radius:10px;text-align:center;cursor:pointer;}
.bank-option.active{border:2px solid #3b82f6;}
</style>
</head>
<body>

<div class="container">

<h2>Dashboard</h2>

<div class="card">
<h3>Account Balance</h3>
<p style="font-size:28px;">0.00 €</p>
<div class="flex">
<button class="btn primary" onclick="showWithdraw()">Withdraw</button>
</div>
</div>

<div id="withdraw" style="display:none;">
<div class="card">
<h3>Withdraw Funds</h3>

<label>Amount</label>
<input type="text" placeholder="0.00 €">

<h4>Withdrawal Method</h4>
<div class="flex">
<div class="bank-option active">Bank Transfer</div>
<div class="bank-option">Crypto Wallet</div>
<div class="bank-option">Wire Transfer</div>
</div>

<label>Bank Account Details</label>
<textarea placeholder="Bank name, IBAN..."></textarea>

<button class="btn primary" style="margin-top:15px;">Link Bank</button>

<div class="card" style="margin-top:20px;">
<h4>Linked Banks</h4>
<p>BBVA - ****1234</p>
<p>Revolut - ****5678</p>
</div>

<button class="btn primary" style="width:100%;margin-top:15px;">Submit Withdrawal</button>

</div>
</div>

</div>

<script>
function showWithdraw(){
 document.getElementById('withdraw').style.display='block';
}
</script>

</body>
</html>
